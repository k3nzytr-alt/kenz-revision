<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kenz · GCSE Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--bg2:#11141b;--card:#161a23;--card2:#1c212c;--line:#262c39;--ink:#e8ebf2;--muted:#8b93a7;--dim:#5d6578;--acc:#7c8cff;--good:#3ddc97;--r:16px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:#7c8cff55}
/* layout */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--bg2);padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;padding:4px 10px 18px}
.brand i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#7c8cff,#3ddc97);display:grid;place-items:center;font-style:normal;font-size:14px;color:#0b0d12}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500;transition:background .2s,color .2s}
.nav:hover{background:var(--card);color:var(--ink)}
.nav.on{background:var(--card2);color:var(--ink)}
.nav .dot{width:8px;height:8px;border-radius:3px;background:var(--c,var(--dim));flex:none}
.nav .pc{margin-left:auto;font:500 11px "JetBrains Mono";color:var(--dim)}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);padding:16px 12px 6px;font-weight:600}
main{min-width:0;padding:28px 36px 90px;max-width:1180px}
.view{display:none}.view.on{display:block;animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag>*{opacity:0;animation:in .5s var(--ease) forwards}
.stag>*:nth-child(1){animation-delay:.03s}.stag>*:nth-child(2){animation-delay:.07s}.stag>*:nth-child(3){animation-delay:.11s}.stag>*:nth-child(4){animation-delay:.15s}.stag>*:nth-child(5){animation-delay:.19s}.stag>*:nth-child(6){animation-delay:.23s}.stag>*:nth-child(n+7){animation-delay:.27s}
h1{font-size:32px;letter-spacing:-.03em;margin:0 0 4px;font-weight:800}
h2{font-size:19px;letter-spacing:-.01em;margin:0;font-weight:700}
.sub{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.sec{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px}
.sec h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.bar{height:8px;background:#232937;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--c,var(--acc));transition:width 1s var(--ease)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:transform .15s,background .2s,border-color .2s}
.btn:hover{border-color:#3a4254;transform:translateY(-1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0b0d12}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.yt{background:#ff3b3b1a;border-color:#ff3b3b44;color:#ff8a8a}
.btn.yt:hover{background:#ff3b3b2e}
.btn.yt2{color:#ff8a8a;opacity:.8}.btn.mgb{background:#9b6bff1a;border-color:#9b6bff44;color:#c7b0ff}.btn.have{border-color:#3ddc9788;color:#7ff0bf}.btn.pri.have{color:#0b0d12;box-shadow:0 0 0 2px #3ddc9766}#exdrop{padding:16px}.mg{display:contents}.btn.qz{background:#3ddc971a;border-color:#3ddc9744;color:#7ff0bf}.btn.ln{background:#22c4ee14;border-color:#22c4ee3d;color:#8fe3f7}
.uh .qz{margin-left:auto;margin-right:10px}.mbox.qbox{max-width:680px;width:100%}.qopt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;cursor:pointer;transition:.15s}.qopt:hover:not([disabled]){border-color:var(--acc);transform:translateX(3px)}.qopt.ok{border-color:#3ddc97;background:#3ddc9722}.qopt.bad{border-color:#ff5c5c;background:#ff5c5c22}.qexp{margin-top:12px;padding:12px 14px;border-radius:12px;background:#ffffff08;color:var(--muted);font-size:14px;line-height:1.5}.qq{font-size:17px;line-height:1.45;margin:6px 0 10px}.note-md{max-height:65vh;overflow:auto;line-height:1.6;font-size:14.5px}.note-md h3{margin:16px 0 6px;font-size:15px;color:var(--acc)}.note-md ul{margin:6px 0 6px 18px;padding:0}.note-md li{margin:3px 0}.spin{display:inline-block;width:16px;height:16px;border:2px solid #ffffff33;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:8px}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .bg{stroke:#232937}.ring .fg{stroke:url(#gr);stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800;letter-spacing:-.03em}
.ring b small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0;text-align:center;margin-top:-34px}
.count{display:flex;gap:10px;margin-top:16px}
.count div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:84px}
.count b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:var(--muted)}
/* subject cards */
.scard{position:relative;overflow:hidden;cursor:pointer;transition:transform .25s var(--ease),border-color .25s}
.scard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.scard::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--c);opacity:.09;filter:blur(8px);transition:opacity .3s}
.scard:hover::after{opacity:.18}
.scard .ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);display:grid;place-items:center;font-size:20px;margin-bottom:14px}
.scard h3{margin:0;font-size:18px}
.scard .spec{font-size:12.5px;color:var(--muted)}
.scard .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:14px 0 7px}
.scard .meta b{color:var(--ink)}
.next{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.next:hover{border-color:#3a4254;transform:translateX(3px)}
.next .tg{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.next .tt{font-weight:600}
.next .go{margin-left:auto;color:var(--muted)}
/* course */
.chead{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.chead .ic{width:60px;height:60px;border-radius:16px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);display:grid;place-items:center;font-size:28px;flex:none}
.cprog{display:flex;align-items:center;gap:14px;margin:6px 0 0}
.cprog .bar{flex:1;max-width:420px}
.cols{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.unit{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.uh{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none}
.uh h3{margin:0;font-size:15.5px;flex:1}
.uh .n{font:500 12px "JetBrains Mono";color:var(--muted)}
.uh .mini{width:70px}
.uh .chev{color:var(--dim);transition:transform .3s var(--ease)}
.unit.open .chev{transform:rotate(90deg)}
.ub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.unit.open .ub{grid-template-rows:1fr}
.ub>div{overflow:hidden}
.topic{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.topic .tt{flex:1;min-width:180px;font-weight:500;transition:color .3s}
.topic.done .tt{color:var(--muted)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #3a4254;background:none;display:grid;place-items:center;flex:none;transition:all .25s var(--ease);padding:0}
.chk:hover{border-color:var(--c)}
.chk svg{width:13px;height:13px;stroke:#0b0d12;stroke-width:3.2;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s var(--ease) .05s}
.done .chk{background:var(--c);border-color:var(--c);transform:scale(1.06)}
.done .chk svg{stroke-dashoffset:0}
.tact{display:flex;gap:6px;flex-wrap:wrap}
.side .card{margin-bottom:14px}
.side h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rl{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:0 -10px;border-radius:9px;font-size:13.5px;transition:background .2s}
.rl:hover{background:var(--card2)}
.rl .k{font:600 10px "JetBrains Mono";padding:2px 6px;border-radius:5px;flex:none}
.k-pdf{background:#ff6b6b22;color:#ff8a8a}.k-sp{background:#5b8cff22;color:#8fb0ff}.k-web{background:#3ddc9722;color:#6ff0b8}.k-img{background:#f5b94222;color:#ffd27a}
.paper{font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px dashed var(--line)}
.paper:last-child{border:0}
/* plan */
.week{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;overflow:hidden}
.week.now{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 10px 40px -20px var(--acc)}
.wh{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
.wh .wn{font:600 12px "JetBrains Mono";color:var(--muted);width:70px}
.wh h3{margin:0;font-size:15px;flex:1}
.wh .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--muted)}
.week.now .wh .tag{background:var(--acc);color:#0b0d12}
.wh .mini{width:90px}
.wb{display:none;padding:0 18px 14px}
.week.open .wb{display:block;animation:in .35s var(--ease)}
.wt{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.wt .sj{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c);width:120px;flex:none}
.wt .tt{flex:1;font-size:14px}
.wt.done .tt{color:var(--muted);text-decoration:line-through}
.note{font-size:13px;color:var(--muted)}
/* exams */
.ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.ex .card h3{margin:0 0 2px;display:flex;align-items:center;gap:10px}
.ex .card h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
/* modal */
.modal{position:fixed;inset:0;background:#05060acc;backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;width:min(620px,100%);animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.flash{min-height:180px;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:600;line-height:1.35;padding:20px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;perspective:800px}
.flash .ans{font-size:16px;color:var(--good);margin-top:12px;font-weight:600}
.lightbox img{max-width:min(1100px,92vw);max-height:84vh;border-radius:12px;display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .3s var(--ease);z-index:200;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:150}
/* editor */
#v-editor.on{display:flex}
#v-editor{position:fixed;inset:0;z-index:60;background:#0a0b0f;flex-direction:column}
.etop{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.etop .fname{flex:1;min-width:120px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etop .fname b{color:var(--ink)}
.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.ib:disabled{opacity:.35;cursor:default}
.ib svg,.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zv{font:500 12px "JetBrains Mono";min-width:46px;text-align:center}
.eprops{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:46px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.eprops .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.eprops input[type=range]{width:110px;accent-color:var(--acc)}
.ework{flex:1;min-height:0;display:flex;gap:12px;padding:12px 16px 0}
.rail{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;align-self:flex-start}
.tool{width:40px;height:40px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center}
.tool:hover{background:var(--card2)}
.tool[aria-pressed=true]{background:var(--acc);color:#0b0d12}
.stage{flex:1;min-width:0;overflow:auto}
#pages{display:flex;flex-direction:column;align-items:center;gap:24px;padding:6px 0 80px;min-width:min-content}
.pgl{font:500 11px "JetBrains Mono";color:var(--dim);margin-bottom:6px}
.sheet{position:relative;background:#fff;box-shadow:0 12px 40px -12px #000}
.sheet canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.sheet .hlc{mix-blend-mode:multiply;pointer-events:none}
.sheet .pdfc{pointer-events:none}
.ov{touch-action:none}
#v-editor[data-tool=select] .ov{touch-action:pan-x pan-y pinch-zoom}
#v-editor[data-tool=text] .ov{cursor:text}
#v-editor[data-tool=draw] .ov,#v-editor[data-tool=hl] .ov,#v-editor[data-tool=wo] .ov,#v-editor[data-tool=box] .ov,#v-editor[data-tool=erase] .ov{cursor:crosshair}
.tedit{position:absolute;z-index:5;border:1px dashed var(--acc);background:rgba(255,255,255,.7);padding:0;margin:0;resize:none;overflow:hidden;font-family:Helvetica,Arial,sans-serif;line-height:1.25;white-space:pre;outline:none;min-width:40px}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:40px}
.drop{border:2px dashed #3a4254;border-radius:18px;padding:50px 30px;text-align:center;transition:all .2s}
.drop.over{border-color:var(--acc);background:#7c8cff10}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:20px;text-align:left}
@media (max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}.brand,.navh{display:none}.nav .pc{display:none}main{padding:20px 16px 80px}.cols{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.ework{flex-direction:column}.rail{flex-direction:row;align-self:stretch;overflow-x:auto}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stag>*{opacity:1}}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#3ddc97"/></linearGradient></defs></svg>
<div class="shell">
<aside id="side"></aside>
<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-course"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-exams"></section>
  <section class="view" id="v-library"></section>
</main>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}if(window.SYNC)SYNC.touch(k)}};
let DONE=new Set(store.get('kz_done',[]));
const saveDone=()=>store.set('kz_done',[...DONE]);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400)}
const spUrl=(p,file)=>file?SP_ROOT+(SP_BASE+p).split('/').map(encodeURIComponent).join('/')+(/\.(docx?|pptx?)$/i.test(p)?'?web=1':''):SP_ROOT+'/KS4%20Student%20Learning%20Materials/Forms/AllItems.aspx?id='+encodeURIComponent((SP_BASE+p).replace(/\/$/,''));
const yt=(c,q)=>'https://www.youtube.com/results?search_query='+encodeURIComponent((c?c+' ':'')+q);
const ytCh=(h,q)=>'https://www.youtube.com/'+h+'/search?query='+encodeURIComponent(q);
// video sources per course: first = main Watch button (channel-scoped where the channel covers the exact spec)
const VIDS={maths:[['Maths Genie',(t)=>ytCh('@mathsgenie7808',mgOf(t)[0]?MG[mgOf(t)[0]][0]:t.q)],['Corbettmaths',t=>yt('Corbettmaths',t.q)]],
 science:[['Cognito',t=>yt('Cognito',t.q)],['Freesciencelessons',t=>yt('Freesciencelessons',t.q)]],
 english:[['Mr Bruff',t=>yt('Mr Bruff',t.q)],['Mr Salles',t=>yt('Mr Salles',t.q)]],
 cs:[["Craig'n'Dave",t=>yt("Craig n Dave",t.q)],['CS Tutor',t=>yt('Computer Science Tutor',t.q)]],
 geography:[['Time for Geography',t=>yt('Time for Geography',t.q)],['Cognito',t=>yt('Cognito',t.q)]],
 business:[['Two Teachers',t=>yt('Two Teachers',t.q)],['tutor2u',t=>yt('tutor2u',t.q)]]};
const mgOf=t=>(typeof MGMAP!=='undefined'&&MGMAP[t.title])||[];
const vid=(t,i=0)=>{const v=VIDS[t.c.id];return v&&v[i]?v[i][1](t):i?'':yt(t.c.ch,t.q)};
// ---------- local paper store (IndexedDB): papers you import open straight in the editor ----------
const lname=u=>{try{const x=new URL(u);const p=decodeURIComponent(x.pathname).replace(/^\/download\//,'').replace(/^\//,'');return (x.hostname.replace(/^(www|old-asset|old)\./,'')+'__'+p).replace(/[\/\\:*?"<>|]+/g,'_').replace(/\s+/g,' ')}catch(e){return u}};
const IDB={db:null,async o(){if(this.db)return this.db;return this.db=await new Promise((r,j)=>{const q=indexedDB.open('kz_papers',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})},
 async tx(m,fn){const d=await this.o();return new Promise((r,j)=>{const t=d.transaction('f',m);const st=t.objectStore('f');const q=fn(st);t.oncomplete=()=>r(q&&q.result);t.onerror=()=>j(t.error)})},
 get(k){return this.tx('readonly',s=>s.get(k))},put(k,v){return this.tx('readwrite',s=>s.put(v,k))},keys(){return this.tx('readonly',s=>s.getAllKeys())}};
let HAVE=new Set();IDB.keys().then(k=>{HAVE=new Set(k.filter(x=>!/^(quiz|note):/.test(x)));if(location.hash==='#exams')exams()}).catch(()=>{});

// flatten topics
const T=[];
COURSES.forEach(c=>c.units.forEach((u,ui)=>u.topics.forEach((t,ti)=>{
  T.push({id:c.id+':'+t[0].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),c,u,title:t[0],q:t[1],files:t[2]||[],quiz:t[3]||null,sp:t[4]||null});
})));
const byC=id=>T.filter(t=>t.c.id===id);
const pct=list=>list.length?Math.round(list.filter(t=>DONE.has(t.id)).length/list.length*100):0;

// ---------- plan ----------
const EXAM=new Date('2027-05-11T09:00:00');
function mondays(){const out=[];let d=new Date('2026-11-16');while(d<=new Date('2027-05-03')){out.push(new Date(d));d.setDate(d.getDate()+7)}return out}
const WEEKS=mondays().map(d=>{const k=d.toISOString().slice(0,10);
  let kind='learn',label='';
  if(k==='2026-12-21'||k==='2026-12-28'){kind='review';label='Christmas: catch-up & mock papers'}
  else if(k==='2027-02-15'){kind='review';label='Half term: past-paper week'}
  else if(k==='2027-03-29'||k==='2027-04-05'){kind='papers';label='Easter: full timed papers'}
  else if(k==='2027-04-26'||k==='2027-05-03'){kind='papers';label='Final countdown: papers + quotes'}
  return {d,k,kind,label,tasks:[]}});
(function assign(){const learn=WEEKS.filter(w=>w.kind==='learn');
  COURSES.forEach(c=>{const ts=byC(c.id);ts.forEach((t,i)=>{const w=learn[Math.min(learn.length-1,Math.floor(i*learn.length/ts.length))];w.tasks.push(t)})})})();
const curWeek=()=>{const now=new Date();let i=WEEKS.findIndex((w,j)=>now<(WEEKS[j+1]?.d||new Date('2027-05-10')));return Math.max(0,i)};
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});

// ---------- sidebar ----------
function side(){const h=location.hash.slice(1)||'home';
  $('#side').innerHTML=`<div class="brand"><i>K</i>Revision</div>
  <a class="nav ${h==='home'?'on':''}" href="#home">🏠&nbsp; Dashboard</a>
  <a class="nav ${h==='plan'?'on':''}" href="#plan">🗓&nbsp; My plan</a>
  <a class="nav ${h==='exams'?'on':''}" href="#exams">📝&nbsp; Exams & papers</a>
  <a class="nav ${h==='library'?'on':''}" href="#library">✏️&nbsp; PDF editor</a>
  <a class="nav" href="#" id="syncBtn">☁️&nbsp; Sync <span class="pc" id="syncSt">${window.SYNC?SYNC.badge():''}</span></a>
  <div class="navh">Courses</div>
  ${COURSES.map(c=>`<a class="nav ${h===c.id?'on':''}" style="--c:${c.color}" href="#${c.id}"><span class="dot"></span>${esc(c.name)}<span class="pc">${pct(byC(c.id))}%</span></a>`).join('')}`}

// ---------- dashboard ----------
function home(){const all=pct(T);const now=new Date();const days=Math.max(0,Math.ceil((EXAM-now)/864e5));const wi=curWeek(),w=WEEKS[wi];
  const C=2*Math.PI*56;
  $('#v-home').innerHTML=`<div class="stag">
  <div class="hero"><div><h1>Hey Kenz 👋</h1><p class="sub">${days} days until your first GCSE exam (mid-May 2027; check your school timetable for exact dates).</p>
    <div class="count"><div><b>${days}</b><span>days left</span></div><div><b>${T.filter(t=>DONE.has(t.id)).length}<span style="font-size:14px;color:var(--muted)">/${T.length}</span></b><span>topics done</span></div><div><b>${wi+1}<span style="font-size:14px;color:var(--muted)">/${WEEKS.length}</span></b><span>plan week</span></div></div></div>
    <div class="ring"><svg width="132" height="132"><circle class="bg" cx="66" cy="66" r="56"/><circle class="fg" id="ringfg" cx="66" cy="66" r="56" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><b>${all}%<small>overall</small></b></div></div>
  <div class="sec"><h2>Your courses</h2></div>
  <div class="grid g3 stag">${COURSES.map(c=>{const ts=byC(c.id),d=ts.filter(t=>DONE.has(t.id)).length;return `<a class="card scard" style="--c:${c.color}" href="#${c.id}"><div class="ic">${c.icon}</div><h3>${esc(c.name)}</h3><div class="spec">${esc(c.spec)}</div><div class="meta"><span><b>${d}</b> / ${ts.length} topics</span><b>${pct(ts)}%</b></div><div class="bar"><i data-w="${pct(ts)}"></i></div></a>`}).join('')}</div>
  <div class="sec"><h2>This week · ${fmt(w.d)}</h2><a class="btn sm" href="#plan">Full plan →</a></div>
  <div class="grid">${w.tasks.length?w.tasks.map(t=>nextRow(t)).join(''):`<div class="card"><b>${esc(w.label)}</b><p class="note">Do one timed past paper per subject. Open them from <a href="#exams" style="color:var(--acc)">Exams</a> and mark them up in the editor.</p></div>`}</div>
  <div class="sec"><h2>Up next in each course</h2></div>
  <div class="grid">${COURSES.map(c=>{const t=byC(c.id).find(t=>!DONE.has(t.id));return t?nextRow(t):''}).join('')}</div></div>`;
  requestAnimationFrame(()=>{setTimeout(()=>{const r=$('#ringfg');if(r)r.style.strokeDashoffset=C*(1-all/100);animBars()},60)});
}
function nextRow(t){return `<a class="next" style="--c:${t.c.color}" href="#${t.c.id}" data-jump="${t.id}"><span class="chk${DONE.has(t.id)?'':''}" style="pointer-events:none;${DONE.has(t.id)?'background:var(--c);border-color:var(--c)':''}"></span><div><div class="tg">${esc(t.c.name)} · ${esc(t.u.name)}</div><div class="tt">${esc(t.title)}</div></div><span class="go">→</span></a>`}
function animBars(){$$('.bar i[data-w]').forEach(b=>b.style.width=b.dataset.w+'%')}

// ---------- course ----------
let openUnits=store.get('kz_open',{});
function course(id){const c=COURSES.find(x=>x.id===id);const ts=byC(id);const v=$('#v-course');v.style.setProperty('--c',c.color);
  const res=r=>{if(r.f)return `<a class="rl" href="#" data-open="${esc(r.f)}" data-name="${esc(r.t)}"><span class="k ${/\.png$/.test(r.f)?'k-img':'k-pdf'}">${/\.png$/.test(r.f)?'IMG':'EDIT'}</span>${esc(r.t)}</a>`;
    return `<a class="rl" href="${esc(spUrl(r.sp,r.file))}" target="_blank" rel="noopener"><span class="k k-sp">SCHOOL</span>${esc(r.t)}</a>`};
  v.innerHTML=`<div class="stag"><div class="chead"><div class="ic">${c.icon}</div><div style="flex:1"><h1>${esc(c.name)}</h1><p class="sub">${esc(c.spec)}</p>
   <div class="cprog"><div class="bar"><i data-w="${pct(ts)}"></i></div><b id="cpct">${pct(ts)}%</b><span class="note">${ts.filter(t=>DONE.has(t.id)).length}/${ts.length} topics</span></div></div></div>
  <div class="cols"><div>${c.units.map((u,ui)=>{const ut=ts.filter(t=>t.u===u);const k=id+'-'+ui;const op=openUnits[k]??(ut.some(t=>!DONE.has(t.id))&&ui===c.units.findIndex(uu=>ts.filter(t=>t.u===uu).some(t=>!DONE.has(t.id))));
    return `<div class="unit${op?' open':''}" data-u="${k}"><div class="uh"><span class="chev">▶</span><h3>${esc(u.name)}</h3><button class="btn sm qz" data-uq="${k}" title="10 mixed questions across this unit">🧠 Unit quiz</button><span class="n">${ut.filter(t=>DONE.has(t.id)).length}/${ut.length}</span><div class="bar mini"><i data-w="${pct(ut)}"></i></div></div>
     <div class="ub"><div>${ut.map(t=>topicRow(t)).join('')}</div></div></div>`}).join('')}</div>
  <div class="side"><div class="card"><h4>Exam papers</h4>${c.papers.map(p=>`<div class="paper">${esc(p)}</div>`).join('')}</div>
   <div class="card"><h4>School resources</h4>${c.resources.map(res).join('')||'<p class="note">None in the folder.</p>'}</div>
   <div class="card"><h4>Past papers & practice</h4><a class="rl" href="#exams" onclick="store.set('kz_exc','${c.id}');exC='${c.id}'"><span class="k k-pdf">PAPERS</span>${(PAPERS[c.id]||[]).length} past-paper sittings + mark schemes →</a>${c.boards.map(([t,u])=>`<a class="rl" href="${esc(u)}" target="_blank" rel="noopener"><span class="k k-web">WEB</span>${esc(t)}</a>`).join('')}
   <p class="note" style="margin-top:10px">Download a paper, then press <b>Open PDF</b> in the <a href="#library" style="color:var(--acc)">editor</a> to answer on it.</p></div></div></div></div>`;
  setTimeout(animBars,60);
  const j=sessionStorage.getItem('jump');if(j){sessionStorage.removeItem('jump');const el=v.querySelector(`[data-t="${j}"]`);if(el){el.closest('.unit').classList.add('open');setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'center'});el.animate([{background:'#7c8cff30'},{background:'transparent'}],{duration:1600})},250)}}
}
function topicRow(t){const files=t.files.map(f=>/\.png$/.test(f)?`<button class="btn sm" data-img="${esc(f)}">🖼 Quotes sheet</button>`:`<button class="btn sm" data-open="${esc(f)}" data-name="${esc(t.title)}">✏️ ${t.files.length>1?esc(f.replace(/^.*?--/,'').replace(/-/g,' ').replace(/\.pdf$/,'').slice(0,22)):'Notes'}</button>`).join('');
  const v2=vid(t,1),mg=mgOf(t).map(n=>MG[n]).filter(Boolean);
  const mgb=mg.length?`<span class="mg">${mg.map((m,i)=>`<a class="btn sm mgb" href="${esc(m[1])}" target="_blank" rel="noopener" title="Maths Genie ${esc(m[0])}: video + worked examples">🧞 ${esc(m[0].length>24?m[0].slice(0,22)+'…':m[0])}</a>${m[2]?`<a class="btn sm${HAVE.has(lname(m[2]))?' have':''}" href="${esc(m[2])}" data-ext="${esc(m[2])}" data-name="MG ${esc(m[0])} questions">📝 Qs</a><a class="btn sm${HAVE.has(lname(m[3]))?' have':''}" href="${esc(m[3])}" data-ext="${esc(m[3])}" data-name="MG ${esc(m[0])} answers">✓ Ans</a>`:''}`).join('')}</span>`:'';
  return `<div class="topic${DONE.has(t.id)?' done':''}" data-t="${t.id}" style="--c:${t.c.color}"><button class="chk" data-done="${t.id}" aria-label="Mark done"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><span class="tt">${esc(t.title)}</span>
  <span class="tact"><a class="btn sm yt" href="${esc(vid(t))}" target="_blank" rel="noopener" title="${esc((VIDS[t.c.id]||[[t.c.ch]])[0][0])}">▶ ${esc((VIDS[t.c.id]||[['Watch']])[0][0])}</a>${v2?`<a class="btn sm yt2" href="${esc(v2)}" target="_blank" rel="noopener">▶ ${esc(VIDS[t.c.id][1][0])}</a>`:''}<button class="btn sm qz" data-tq="${t.id}">🧠 Quiz${QS[t.id]!=null?` <b style="color:${QS[t.id]>=80?'#3ddc97':QS[t.id]>=50?'#f5b942':'#ff7a59'}">${QS[t.id]}%</b>`:''}</button><button class="btn sm ln" data-tl="${t.id}">📘 Learn</button>${mgb}${files}${t.sp?`<a class="btn sm" href="${esc(spUrl(t.sp,true))}" target="_blank" rel="noopener">📄 School notes</a>`:''}${t.quiz?`<button class="btn sm" data-quiz="${t.quiz}">⚡ Quote quiz</button>`:''}</span></div>`}

// ---------- plan view ----------
function plan(){const wi=curWeek();
  $('#v-plan').innerHTML=`<h1>My revision plan</h1><p class="sub">${WEEKS.length} weeks from 16 Nov to the exams. Every topic across your six courses is spread out, with holidays saved for past papers. Ticking a topic here also ticks it in the course.</p>

   <div class="wb">${w.tasks.length?w.tasks.map(t=>`<div class="wt${DONE.has(t.id)?' done':''}" style="--c:${t.c.color}"><button class="chk" data-done="${t.id}" style="${DONE.has(t.id)?'background:var(--c);border-color:var(--c)':''}"><svg viewBox="0 0 24 24" style="${DONE.has(t.id)?'stroke-dashoffset:0':''}"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><span class="sj">${esc(t.c.name)}</span><span class="tt">${esc(t.title)}</span><a class="btn sm yt" href="${esc(vid(t))}" target="_blank" rel="noopener">▶</a><a class="btn sm" href="#${t.c.id}" data-jump="${t.id}">Open</a></div>`).join(''):

// ---------- confetti ----------
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(x,y,col,n){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;cv.width=innerWidth;cv.height=innerHeight;
  const cols=[col,'#7c8cff','#3ddc97','#ffd166','#ff7a59'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*(n>50?9:5);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(n>50?4:2),r:3+Math.random()*4,c:cols[i%cols.length],l:60+Math.random()*40,rot:Math.random()*6})}
  if(!raf)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.98;p.rot+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);cx.restore()});raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

 const TS=()=>{try{return JSON.parse(localStorage.getItem('kz_ts')||'{}')}catch(e){return{}}};const setTS=o=>{try{localStorage.setItem('kz_ts',JSON.stringify(o))}catch(e){}};

async function genQuiz(ts){const multi=ts.length>1,n=multi?10:6;

${multi?`Write ${n} questions spread across these topics from this unit:\n${list}`:`Write ${n} questions that test exactly this specification point and nothing outside it.`}

async function topicQuiz(ts){ts=ts.filter(Boolean);if(!ts.length)return;const multi=ts.length>1,key='quiz:'+(multi?'u:'+ts[0].c.id+':'+ts[0].u.name:ts[0].id);

    if(!multi){QS[ts[0].id]=Math.max(QS[ts[0].id]||0,p);store.set('kz_qs',QS);$$(`[data-tq="${ts[0].id}"]`).forEach(b=>b.innerHTML=`🧠 Quiz <b style="color:${QS[ts[0].id]>=80?'#3ddc97':QS[ts[0].id]>=50?'#f5b942':'#ff7a59'}">${QS[ts[0].id]}%</b>`)}

${ctxOf(t)}

 m.querySelector('#lr').onclick=()=>go(true);go(false)}

let drag=null;
const local=(ev,c)=>{const r=c.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}};
function hitTest(p,pt,vp,type){for(let i=p.annots.length-1;i>=0;i--){const a=p.annots[i];if(type&&a.type!==type)continue;const b=bbox(a,vp);if(pt.x>=b.x-5&&pt.x<=b.x+b.w+5&&pt.y>=b.y-5&&pt.y<=b.y+b.h+5)return a}return null}
function selectA(page,id){const prev=S.sel?.page;S.sel=id?{page,id}:null;if(prev&&prev!==page){const q=pageById(prev);q&&drawOverlay(q)}const p=pageById(page);p&&drawOverlay(p);renderProps()}
function eraseAt(p,pt,vp){const a=hitTest(p,pt,vp);if(a){if(!drag.erased){drag.before=snap();drag.erased=true}p.annots.splice(p.annots.indexOf(a),1);drawOverlay(p)}}
function onDown(ev,pid){const p=pageById(pid),e=els.get(pid);if(!p||!e)return;if(S.editing){commitEdit();if(S.tool==='text')return}
  const pt=local(ev,e.ovC),vp=e.vp,t=S.tool;
  if(t==='select'){if(S.sel&&S.sel.page===pid){const a=p.annots.find(a=>a.id===S.sel.id);if(a&&resizable(a)){const b=bbox(a,vp);if(Math.abs(pt.x-(b.x+b.w+3))<=11&&Math.abs(pt.y-(b.y+b.h+3))<=11){drag={mode:'resize',p,a,b,before:snap(),moved:false};ev.preventDefault();e.ovC.setPointerCapture(ev.pointerId);return}}}
    const a=hitTest(p,pt,vp);if(a){selectA(pid,a.id);drag={mode:'move',p,a,start:pt,orig:JSON.parse(JSON.stringify(a)),before:snap(),moved:false};ev.preventDefault();e.ovC.setPointerCapture(ev.pointerId)}else selectA(null,null);return}
  if(t==='text'){ev.preventDefault();const a=hitTest(p,pt,vp,'text');if(a)return startEdit(p,a,false);const[x,y]=toP(vp,pt.x,pt.y-S.textSize*vp.scale*0.65);return startEdit(p,{id:nid(),type:'text',x,y,rot:rot(p),size:S.textSize,color:S.color,text:''},true)}
  ev.preventDefault();e.ovC.setPointerCapture(ev.pointerId);
  if(t==='erase'){drag={mode:'erase',p,erased:false};eraseAt(p,pt,vp);return}
  if(t==='draw'){const a={id:nid(),type:'ink',pts:[toP(vp,pt.x,pt.y)],w:S.stroke,color:S.color};S.draft={page:pid,a};drag={mode:'ink',p,a};drawOverlay(p)}
  if(['hl','wo','box'].includes(t)){const a={id:nid(),type:t,color:t==='hl'?S.hl:S.color,w:S.stroke,x0:0,y0:0,x1:0,y1:0};setRectFromView(a,vp,{x:pt.x,y:pt.y,w:0,h:0});S.draft={page:pid,a};drag={mode:'rect',p,a,start:pt}}}
function onMove(ev){if(!drag)return;const e=els.get(drag.p.id);if(!e)return;const pt=local(ev,e.ovC),vp=e.vp;
  if(drag.mode==='erase'){eraseAt(drag.p,pt,vp);return}
  if(drag.mode==='ink'){const last=drag.a.pts[drag.a.pts.length-1],np=toP(vp,pt.x,pt.y);if(Math.hypot(np[0]-last[0],np[1]-last[1])*vp.scale>1.5)drag.a.pts.push(np)}
  else if(drag.mode==='rect'){const s=drag.start;setRectFromView(drag.a,vp,{x:Math.min(s.x,pt.x),y:Math.min(s.y,pt.y),w:Math.abs(pt.x-s.x),h:Math.abs(pt.y-s.y)})}
  else if(drag.mode==='move'){if(!drag.moved&&Math.hypot(pt.x-drag.start.x,pt.y-drag.start.y)<3)return;drag.moved=true;const p0=toP(vp,drag.start.x,drag.start.y),p1=toP(vp,pt.x,pt.y);shift(drag.a,drag.orig,p1[0]-p0[0],p1[1]-p0[1])}
  else if(drag.mode==='resize'){drag.moved=true;const b=drag.b;setRectFromView(drag.a,vp,{x:b.x,y:b.y,w:Math.max(12,pt.x-b.x),h:Math.max(12,pt.y-b.y)})}
  drawOverlay(drag.p)}
function onUp(){if(!drag)return;const d=drag;drag=null;const e=els.get(d.p.id),vp=e?.vp;
  if(d.mode==='erase'&&d.erased){pushUndo(d.before);persist()}
  if(d.mode==='ink'){pushUndo();d.p.annots.push(d.a);persist()}
  if(d.mode==='rect'){const r=rectV(d.a,vp);if(r.w>3&&r.h>3){pushUndo();d.p.annots.push(d.a);persist()}}
  if((d.mode==='move'||d.mode==='resize')&&d.moved){pushUndo(d.before);persist()}
  S.draft=null;drawOverlay(d.p)}
addEventListener('pointermove',onMove);addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
function onDbl(ev,pid){if(S.tool!=='select')return;const p=pageById(pid),e=els.get(pid);const a=hitTest(p,local(ev,e.ovC),e.vp,'text');if(a)startEdit(p,a,false)}
function startEdit(p,a,isNew){const e=els.get(p.id),vp=e.vp,[vx,vy]=toV(vp,a.x,a.y),f=a.size*vp.scale;const ta=document.createElement('textarea');ta.className='tedit';ta.spellcheck=false;
  Object.assign(ta.style,{left:vx+'px',top:(vy-f*0.1)+'px',fontSize:f+'px',color:a.color,caretColor:a.color});ta.value=a.text;
  const fit=()=>{ta.style.width='0';ta.style.height='0';ta.style.width=(ta.scrollWidth+f*0.6)+'px';ta.style.height=ta.scrollHeight+'px'};
  ta.addEventListener('input',fit);ta.addEventListener('keydown',ev=>{if(ev.key==='Escape'||(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey))){ev.preventDefault();commitEdit()}ev.stopPropagation()});
  ta.addEventListener('blur',()=>setTimeout(()=>{if(S.editing&&S.editing.ta===ta)commitEdit()},0));
  S.editing={p,a,ta,isNew,before:snap()};e.sheet.appendChild(ta);fit();drawOverlay(p);requestAnimationFrame(()=>{ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)});if(!isNew)selectA(p.id,a.id);renderProps()}
function commitEdit(){const ed=S.editing;if(!ed)return;S.editing=null;const txt=ed.ta.value.replace(/\s+$/,'');ed.ta.remove();const p=ed.p,i=p.annots.indexOf(ed.a);
  if(!txt){if(i>=0){pushUndo(ed.before);p.annots.splice(i,1);if(S.sel?.id===ed.a.id)S.sel=null}}
  else if(ed.isNew){pushUndo(ed.before);ed.a.text=txt;p.annots.push(ed.a)}
  else if(txt!==ed.a.text){pushUndo(ed.before);ed.a.text=txt}
  persist();drawOverlay(p);renderProps()}
function buildRail(){const r=$('#rail');r.innerHTML='';for(const[id,title,svg]of TOOLS){const b=document.createElement('button');b.className='tool';b.dataset.tool=id;b.title=title;b.setAttribute('aria-label',title);b.innerHTML=`<svg viewBox="0 0 24 24">${svg}</svg>`;b.onclick=()=>setTool(id);r.appendChild(b)}}
function setTool(t){if(S.editing)commitEdit();S.tool=t;$('#v-editor').dataset.tool=t;if(t!=='select'&&S.sel)selectA(null,null);$$('.tool').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===t)));renderProps()}
function applyToSel(fn){const[p,a]=findAnnot(S.sel);if(!a)return;pushUndo();fn(a);drawOverlay(p);persist()}
function renderProps(){const el=$('#props');el.innerHTML='';const[,sa]=findAnnot(S.sel);const edA=S.editing?.a;const ctx=edA?edA.type:sa?sa.type:S.tool;const target=edA||sa;
  const add=(...n)=>n.forEach(x=>el.appendChild(x));const lbl=s=>{const x=document.createElement('span');x.className='lbl';x.textContent=s;return x};const hint=s=>{const x=document.createElement('span');x.textContent=s;return x};
  const sw=(list,cur,set)=>{const g=document.createElement('span');g.style.display='flex';g.style.gap='6px';list.forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.setAttribute('aria-pressed',String(c===cur));b.onclick=()=>{set(c);renderProps()};g.appendChild(b)});return g};
  const slider=(label,min,max,step,val,unit,set)=>{const g=document.createElement('label');g.style.display='flex';g.style.alignItems='center';g.style.gap='8px';const r=document.createElement('input');r.type='range';r.min=min;r.max=max;r.step=step;r.value=val;const n=document.createElement('span');n.textContent=val+unit;n.style.font='500 12px JetBrains Mono';r.oninput=()=>{n.textContent=r.value+unit;set(+r.value)};g.append(lbl(label),r,n);return g};
  const setColor=c=>{if(ctx==='hl')S.hl=c;else S.color=c;if(edA){edA.color=c;S.editing.ta.style.color=c;return}if(sa)applyToSel(a=>a.color=c)};
  if(ctx==='text'){add(lbl('Colour'),sw(COLORS,target?target.color:S.color,setColor),slider('Size',8,48,1,target?target.size:S.textSize,'pt',v=>{S.textSize=v;if(edA){edA.size=v;S.editing.ta.style.fontSize=(v*els.get(S.editing.p.id).vp.scale)+'px';S.editing.ta.dispatchEvent(new Event('input'))}else if(sa){const[p,a]=findAnnot(S.sel);a.size=v;drawOverlay(p);persist()}}));if(!target)add(hint('Click anywhere on the page to type your answer.'))}
  else if(ctx==='draw'||ctx==='ink'||ctx==='box'){add(lbl('Colour'),sw(COLORS,target?target.color:S.color,setColor),slider('Width',.5,10,.5,target?target.w:S.stroke,'pt',v=>{S.stroke=v;if(sa){const[p,a]=findAnnot(S.sel);a.w=v;drawOverlay(p);persist()}}))}
  else if(ctx==='hl'){add(lbl('Highlighter'),sw(HLS,target?target.color:S.hl,setColor));if(!target)add(hint('Drag across the lines you want to mark.'))}
  else if(ctx==='wo')add(hint('Drag over anything to cover it with white, then type on top.'));
  else if(ctx==='erase')add(hint('Drag over your pen marks, text or boxes to remove them.'));
  else add(hint('Click something you added to move it. Press Delete to remove it.'));
  if(sa&&!edA){const del=document.createElement('button');del.className='btn sm';del.textContent='Delete';del.onclick=deleteSel;add(del)}}
function deleteSel(){const[p,a]=findAnnot(S.sel);if(!a)return;pushUndo();p.annots.splice(p.annots.indexOf(a),1);S.sel=null;drawOverlay(p);renderProps();persist()}
function undo(){if(S.editing)commitEdit();if(!S.undo.length)return;S.redo.push(snap());restore(S.undo.pop());S.sel=null;S.pages.forEach(drawOverlay);renderProps();updateUI();persist()}
function redo(){if(S.editing)commitEdit();if(!S.redo.length)return;S.undo.push(snap());restore(S.redo.pop());S.sel=null;S.pages.forEach(drawOverlay);renderProps();updateUI();persist()}
function updateUI(){$('#undoBtn').disabled=!S.undo.length;$('#redoBtn').disabled=!S.redo.length;$('#zoomV').textContent=Math.round(S.zoom*100)+'%';$('#eFile').innerHTML=S.name?`<b>${esc(S.name)}</b> · ${S.pages.length} page${S.pages.length===1?'':'s'} · <span style="color:var(--good)">autosaves</span>`:'No file'}
window.openBytes=async(bytes,name,key)=>{let doc;try{doc=await pdfjsLib.getDocument({data:bytes.slice(),isEvalSupported:false}).promise}catch(err){return toast(err?.name==='PasswordException'?'That PDF is password-protected.':'Couldn’t read that PDF.')}
  cache.clear();S.bytes=bytes;S.name=name;S.key=key;S.undo=[];S.redo=[];S.sel=null;S.zoom=1;structKey='';
  const saved=store.get('kz_marked',{})[key]||[];S.pages=[];
  for(let i=0;i<doc.numPages;i++){const pg=await doc.getPage(i+1);cache.set(i,pg);S.pages.push({id:nid(),index:i,base:pg.rotate||0,annots:saved[i]||[]})}
  $('#v-editor').classList.add('on');document.body.style.overflow='hidden';$('#stage').scrollTop=0;buildRail();setTool(S.tool);requestAnimationFrame(()=>build(true));
  if(saved.some(a=>a&&a.length))toast('Your earlier marks are back')};
$('#eBack').onclick=()=>{if(S.editing)commitEdit();persist();$('#v-editor').classList.remove('on');document.body.style.overflow='';if(location.hash==='#library')library()};
$('#eOpen').onclick=()=>$('#pdfIn').click();
$('#clearBtn').onclick=()=>{if(!S.pages.some(p=>p.annots.length))return;pushUndo();S.pages.forEach(p=>{p.annots=[];drawOverlay(p)});persist();toast('Marks cleared (Undo brings them back)')};
const ZS=[.5,.67,.8,1,1.25,1.5,2,2.5,3];function zoomBy(d){let i=ZS.findIndex(z=>Math.abs(z-S.zoom)<1e-3);if(i<0)i=3;S.zoom=ZS[Math.max(0,Math.min(ZS.length-1,i+d))];build()}
$('#zoomIn').onclick=()=>zoomBy(1);$('#zoomOut').onclick=()=>zoomBy(-1);$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>$('#v-editor').classList.contains('on')&&build(),180)});
document.addEventListener('keydown',ev=>{if(!$('#v-editor').classList.contains('on'))return;const tag=(ev.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;const k=ev.key.toLowerCase(),mod=ev.metaKey||ev.ctrlKey;
  if(mod&&k==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return}if(mod&&k==='y'){ev.preventDefault();redo();return}if(mod)return;
  if((k==='delete'||k==='backspace')&&S.sel){ev.preventDefault();deleteSel();return}if(k==='escape'){if(S.sel)selectA(null,null);else $('#eBack').click()}
  const map={v:'select',t:'text',p:'draw',h:'hl',e:'erase',w:'wo',r:'box'};if(map[k])setTool(map[k])});
let dlP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function buildPdf(){const{PDFDocument,StandardFonts,rgb,degrees,LineCapStyle,BlendMode}=PDFLib;const doc=await PDFDocument.load(S.bytes,{ignoreEncryption:true});const font=await doc.embedFont(StandardFonts.Helvetica);
  const ok=new Map();const safe=s=>{let o='';for(const ch of s){if(!ok.has(ch)){try{font.encodeText(ch);ok.set(ch,true)}catch{ok.set(ch,false)}}o+=ok.get(ch)?ch:'?'}return o};const col=h=>rgb(...hexRgb(h));const pgs=doc.getPages();
  for(const p of S.pages){const pg=pgs[p.index];const ordered=[...p.annots.filter(a=>a.type==='hl'),...p.annots.filter(a=>a.type!=='hl')];
    for(const a of ordered){
      if(a.type==='hl')pg.drawRectangle({x:a.x0,y:a.y0,width:a.x1-a.x0,height:a.y1-a.y0,color:col(a.color),opacity:.42,blendMode:BlendMode.Multiply});
      else if(a.type==='wo')pg.drawRectangle({x:a.x0,y:a.y0,width:a.x1-a.x0,height:a.y1-a.y0,color:rgb(1,1,1)});
      else if(a.type==='box')pg.drawRectangle({x:a.x0,y:a.y0,width:a.x1-a.x0,height:a.y1-a.y0,borderColor:col(a.color),borderWidth:a.w});
      else if(a.type==='ink'){const d=a.pts.length===1?`M ${a.pts[0][0]} ${-a.pts[0][1]} L ${a.pts[0][0]+0.01} ${-a.pts[0][1]}`:'M '+a.pts.map(q=>`${q[0].toFixed(2)} ${(-q[1]).toFixed(2)}`).join(' L ');pg.drawSvgPath(d,{x:0,y:0,borderColor:col(a.color),borderWidth:a.w,borderLineCap:LineCapStyle.Round})}
      else if(a.type==='text'){const t=a.rot*Math.PI/180,vx=-Math.sin(t),vy=Math.cos(t);a.text.split('\n').forEach((line,i)=>{const dd=a.size*0.8+i*a.size*1.25;if(line)pg.drawText(safe(line),{x:a.x-vx*dd,y:a.y-vy*dd,size:a.size,font,color:col(a.color),rotate:degrees(a.rot)})})}}}
  return await doc.save()}
$('#saveBtn').onclick=async()=>{if(S.editing)commitEdit();const btn=$('#saveBtn');btn.disabled=true;btn.textContent='Building…';
  try{const bytes=await buildPdf();const filename=(S.name||'paper').replace(/\.pdf$/i,'')+' (my answers).pdf';const dl=await dlP;
    if(dl){try{await dl.save({filename,data:new Blob([bytes],{type:'application/pdf'})});toast('Saved '+filename)}catch(err){toast(err?.code==='declined'?'Download cancelled':'Saving isn’t available in this view')}}
    else if(!window.claude){const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
    else toast('Saving isn’t available in this view')}
  catch(err){console.error(err);toast('Couldn’t build the PDF')}finally{btn.disabled=false;btn.textContent='⬇ Save PDF'}};
})();
route();
</script>
